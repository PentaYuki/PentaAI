name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    name: Validate repository
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Compile Python source
        run: |
          python -m compileall -q pentami-core shared mcp-playwright scripts

      - name: Validate Docker Compose
        run: docker compose -f deploy/docker-compose.yml config --quiet

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Check frontend JavaScript
        shell: bash
        run: |
          while IFS= read -r file; do
            node --check "$file"
          done < <(find pentami-core/frontend/js -name '*.js' -print)
