services:
  # PostgreSQL: Lưu trữ người dùng, API Keys, phân quyền RBAC, metadata nghiệp vụ
  postgres:
    image: postgres:16-alpine
    container_name: penta-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: penta_admin
      POSTGRES_PASSWORD: penta_secure_password_2026
      POSTGRES_DB: penta_ecosystem
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U penta_admin -d penta_ecosystem"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Redis: Quản lý cache API Key (<1ms lookup), Rate Limiting (Token Bucket), Pub/Sub cho real-time events
  redis:
    image: redis:7.2-alpine
    container_name: penta-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Qdrant: Vector Database phục vụ RAG (384 dimensions từ all-MiniLM-L6-v2)
  qdrant:
    image: qdrant/qdrant:latest
    container_name: penta-qdrant
    restart: unless-stopped
    ports:
      - "6333:6333" # REST API & Web Dashboard
      - "6334:6334" # gRPC API cho kết nối siêu tốc
    volumes:
      - qdrant_data:/qdrant/storage
    environment:
      QDRANT__SERVICE__ENABLE_CORS: "true"

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  qdrant_data:
    driver: local
